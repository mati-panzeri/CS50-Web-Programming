{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <h1>Edit entry</h1>
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <form action="{% url 'edit' title%}" method="post" class="p4">
                {% csrf_token %}
                {{ form_edit_entry }}
                <button type="submit">Edit entry</button>
            </form>
        </div>
    </div>
{% endblock %}
